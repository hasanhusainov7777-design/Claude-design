<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karusel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Karusel</h1>
    <section class="carousel" aria-roledescription="карусель" aria-label="Слайды">
      <div class="track">
        <div class="slide" style="--bg:#6366f1">1</div>
        <div class="slide" style="--bg:#ec4899">2</div>
        <div class="slide" style="--bg:#f59e0b">3</div>
        <div class="slide" style="--bg:#10b981">4</div>
      </div>
      <button class="nav prev" aria-label="Предыдущий слайд">&#8249;</button>
      <button class="nav next" aria-label="Следующий слайд">&#8250;</button>
      <div class="dots" role="tablist"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
